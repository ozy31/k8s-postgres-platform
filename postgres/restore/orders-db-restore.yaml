# Point-in-time restore of orders-db into a new cluster next to it. The
# original keeps running; compare or copy data across, then either delete
# this one or promote it by repointing the poolers (docs/runbooks).
#
# Set TARGET_TIME (RFC 3339, UTC) before applying, for example:
#   sed "s/TARGET_TIME/2026-11-06T09:15:00Z/" orders-db-restore.yaml | kubectl -n orders apply -f -
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: orders-db-restore
  labels:
    team: orders
    app.kubernetes.io/part-of: orders
spec:
  description: Point-in-time restore of orders-db
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-minimal-trixie
  instances: 1
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      memory: 384Mi
  storage:
    size: 2Gi
  walStorage:
    size: 1Gi
  bootstrap:
    recovery:
      source: orders-db
      database: orders
      owner: orders
      recoveryTarget:
        targetTime: "TARGET_TIME"
  externalClusters:
    # Read-only view of orders-db's backups and WAL archive.
    - name: orders-db
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: orders-db-backups
          serverName: orders-db
