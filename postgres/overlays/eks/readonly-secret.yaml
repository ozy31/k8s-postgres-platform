# The read-only role's password comes from the vault instead of
# hack/ensure-secret.sh. Same Secret name and shape, so the Cluster spec
# does not change between environments.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: orders-db-readonly
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-secrets
  target:
    name: orders-db-readonly
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: orders_readonly
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: pg/orders-db/readonly-password
