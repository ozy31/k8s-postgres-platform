# Alerts for every CNPG cluster in the namespace. Each one links to a
# runbook; tests/alerts holds promtool unit tests for them.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: postgres
spec:
  groups:
    - name: postgres.availability
      rules:
        - alert: PostgresInstanceDown
          expr: cnpg_collector_up == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: Postgres is not running in {{ $labels.pod }}
            runbook_url: https://github.com/ozy31/k8s-postgres-platform/blob/main/docs/runbooks/instance-down.md
        - alert: PostgresNoPrimary
          # No instance of the cluster reports itself out of recovery.
          expr: |
            count by (namespace, cnpg_cluster) (cnpg_pg_replication_in_recovery == 1)
              unless on (namespace, cnpg_cluster)
            count by (namespace, cnpg_cluster) (cnpg_pg_replication_in_recovery == 0)
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.cnpg_cluster }} has no primary"
            runbook_url: https://github.com/ozy31/k8s-postgres-platform/blob/main/docs/runbooks/instance-down.md
        - alert: PostgresStandbyMissing
          # Fewer than two streaming standbys: one more loss and quorum
          # commit can no longer protect acknowledged writes.
          expr: max by (namespace, cnpg_cluster) (cnpg_pg_replication_streaming_replicas) < 2
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.cnpg_cluster }} has {{ $value }} streaming standbys"
            runbook_url: https://github.com/ozy31/k8s-postgres-platform/blob/main/docs/runbooks/instance-down.md
        - alert: PostgresReplicationLagHigh
          expr: cnpg_pg_replication_lag > 30
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.pod }} is {{ $value | humanizeDuration }} behind the primary"
            runbook_url: https://github.com/ozy31/k8s-postgres-platform/blob/main/docs/runbooks/replication-lag.md

    - name: postgres.backup
      rules:
        - alert: PostgresWALArchivingStuck
          # archive_timeout is 5 minutes, so a primary always has a segment to
          # archive at least that often.
          expr: |
            cnpg_pg_stat_archiver_seconds_since_last_archival > 900
              and on (namespace, pod)
            cnpg_pg_replication_in_recovery == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.cnpg_cluster }} has not archived WAL for {{ $value | humanizeDuration }}"
            description: Point-in-time recovery is limited to the last archived segment until this is fixed.
            runbook_url: https://github.com/ozy31/k8s-postgres-platform/blob/main/docs/runbooks/backup-failing.md
        - alert: PostgresBackupTooOld
          # Barman Cloud plugin metrics. The in-tree cnpg_collector_*backup*
          # series are not updated when backups go through the plugin.
          expr: |
            time() - max by (namespace, cnpg_cluster) (barman_cloud_cloudnative_pg_io_last_available_backup_timestamp) > 26 * 3600
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Newest base backup of {{ $labels.cnpg_cluster }} is {{ $value | humanizeDuration }} old"
            runbook_url: https://github.com/ozy31/k8s-postgres-platform/blob/main/docs/runbooks/backup-failing.md
        - alert: PostgresBackupFailed
          expr: |
            max by (namespace, cnpg_cluster) (barman_cloud_cloudnative_pg_io_last_failed_backup_timestamp)
              > max by (namespace, cnpg_cluster) (barman_cloud_cloudnative_pg_io_last_available_backup_timestamp)
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Last base backup of {{ $labels.cnpg_cluster }} failed
            runbook_url: https://github.com/ozy31/k8s-postgres-platform/blob/main/docs/runbooks/backup-failing.md

    - name: postgres.saturation
      rules:
        - alert: PostgresConnectionsNearLimit
          expr: |
            sum by (namespace, cnpg_cluster, pod) (cnpg_backends_total)
              / on (namespace, cnpg_cluster, pod)
            max by (namespace, cnpg_cluster, pod) (cnpg_pg_settings_setting{name="max_connections"})
              > 0.8
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.pod }} is using {{ $value | humanizePercentage }} of max_connections"
            description: Applications should connect through the pooler; check for a client bypassing it.
            runbook_url: https://github.com/ozy31/k8s-postgres-platform/blob/main/docs/runbooks/connections.md
        - alert: PgBouncerClientsWaiting
          expr: max by (namespace, cnpg_cluster, pooler) (cnpg_pgbouncer_pools_maxwait) > 5
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: Clients of {{ $labels.pooler }} have waited {{ $value }}s for a server connection
            runbook_url: https://github.com/ozy31/k8s-postgres-platform/blob/main/docs/runbooks/connections.md
        - alert: PostgresLongTransaction
          expr: max by (namespace, cnpg_cluster, pod, usename) (cnpg_backends_max_tx_duration_seconds) > 1800
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.usename }} has had a transaction open for {{ $value | humanizeDuration }} on {{ $labels.pod }}"
            description: Long transactions hold back vacuum and WAL removal.
            runbook_url: https://github.com/ozy31/k8s-postgres-platform/blob/main/docs/runbooks/connections.md
        - alert: PostgresTransactionIDAgeHigh
          expr: max by (namespace, cnpg_cluster, datname) (cnpg_pg_database_xid_age) > 1e9
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.datname }} on {{ $labels.cnpg_cluster }} is at XID age {{ $value }}"
            description: Wraparound protection forces the database read-only near 2^31; find what blocks freezing.
            runbook_url: https://github.com/ozy31/k8s-postgres-platform/blob/main/docs/runbooks/disk-and-vacuum.md
        - alert: PostgresVolumeFillingUp
          # Kubelet volume stats; covers both the data and the WAL volume.
          expr: |
            kubelet_volume_stats_available_bytes{persistentvolumeclaim=~".+-db-[0-9]+(-wal)?"}
              / kubelet_volume_stats_capacity_bytes{persistentvolumeclaim=~".+-db-[0-9]+(-wal)?"}
              < 0.15
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.persistentvolumeclaim }} has {{ $value | humanizePercentage }} free"
            runbook_url: https://github.com/ozy31/k8s-postgres-platform/blob/main/docs/runbooks/disk-and-vacuum.md
