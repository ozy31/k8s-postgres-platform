# Applications connect to PgBouncer, never to Postgres directly (enforced by
# networkpolicy.yaml). Transaction pooling lets a few hundred client
# connections share a small number of server connections, and the services
# below follow the primary through a failover without any client change.
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: orders-db-pooler-rw
spec:
  cluster:
    name: orders-db
  instances: 2
  type: rw
  pgbouncer:
    poolMode: transaction
    parameters:
      max_client_conn: "1000"
      default_pool_size: "20"
      reserve_pool_size: "5"
      # Protocol-level prepared statements in transaction mode.
      max_prepared_statements: "200"
      server_lifetime: "1800"
      # Queue clients for up to 30s during a failover instead of erroring.
      query_wait_timeout: "30"
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: orders
    spec:
      containers: []
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              cnpg.io/poolerName: orders-db-pooler-rw
---
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: orders-db-pooler-ro
spec:
  cluster:
    name: orders-db
  instances: 2
  type: ro
  pgbouncer:
    poolMode: transaction
    parameters:
      max_client_conn: "1000"
      default_pool_size: "10"
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: orders
    spec:
      containers: []
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              cnpg.io/poolerName: orders-db-pooler-ro
