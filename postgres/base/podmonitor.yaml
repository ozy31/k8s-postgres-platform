# Scrape Postgres (9187) and PgBouncer (9127). The cnpg_cluster label lets
# alerts and dashboards group by database cluster rather than by pod.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: orders-db
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: orders-db
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_label_cnpg_io_cluster]
          targetLabel: cnpg_cluster
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: orders-db-poolers
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: orders-db
      cnpg.io/podRole: pooler
  podMetricsEndpoints:
    - port: metrics
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_label_cnpg_io_cluster]
          targetLabel: cnpg_cluster
        - sourceLabels: [__meta_kubernetes_pod_label_cnpg_io_poolerName]
          targetLabel: pooler
