# Nightly base backup at 02:00 UTC, plus one as soon as the cluster exists
# so point-in-time recovery works from day one. WAL is archived
# continuously in between (Cluster.spec.plugins).
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: orders-db-nightly
spec:
  cluster:
    name: orders-db
  schedule: "0 0 2 * * *"
  immediate: true
  backupOwnerReference: self
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
