# Deny all ingress in the namespace, then open exactly what the cluster
# needs: replication between instances, poolers to instances, the operator
# to the instance manager, and clients from the team's namespaces to the
# poolers only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: orders-db-instances
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: orders-db
      cnpg.io/podRole: instance
  policyTypes:
    - Ingress
  ingress:
    # Streaming replication and pg_rewind between instances.
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: orders-db
              cnpg.io/podRole: instance
      ports:
        - port: 5432
    # PgBouncer to Postgres.
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: orders-db
              cnpg.io/podRole: pooler
      ports:
        - port: 5432
---
# Any CNPG instance in the namespace, including a cluster restored next to
# orders-db: the operator talks to the instance manager (status, promotion)
# and to Postgres.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cnpg-operator
spec:
  podSelector:
    matchLabels:
      cnpg.io/podRole: instance
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - port: 8000
        - port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: orders-db-poolers
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: orders-db
      cnpg.io/podRole: pooler
  policyTypes:
    - Ingress
  ingress:
    # Any namespace owned by the orders team.
    - from:
        - namespaceSelector:
            matchLabels:
              team: orders
      ports:
        - port: 5432
    # Prometheus scraping PgBouncer metrics.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 9127
---
# Prometheus scraping Postgres metrics on every instance in the namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-metrics
spec:
  podSelector:
    matchLabels:
      cnpg.io/podRole: instance
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 9187
