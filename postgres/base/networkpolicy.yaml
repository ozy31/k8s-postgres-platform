# Deny all ingress in the namespace, then open exactly what the cluster
# needs: replication between instances, poolers to instances, the operator
# to the instance manager, and clients from the team's namespaces to the
# poolers only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cnpg-instances
spec:
  # Every CNPG instance in the namespace, so a cluster restored next to
  # orders-db (or a throwaway upgrade rehearsal) can replicate too.
  podSelector:
    matchLabels:
      cnpg.io/podRole: instance
  policyTypes:
    - Ingress
  ingress:
    # Pods of any CNPG cluster in this namespace: other instances
    # (streaming replication, pg_rewind), the join job that clones a new
    # replica with pg_basebackup (it has no podRole label), and the
    # PgBouncer poolers. Only CNPG sets cnpg.io/cluster, and the namespace
    # belongs to one team.
    - from:
        - podSelector:
            matchExpressions:
              - key: cnpg.io/cluster
                operator: Exists
      ports:
        - port: 5432
---
# Any CNPG instance in the namespace, including a cluster restored next to
# orders-db: the operator talks to the instance manager (status, promotion)
# and to Postgres.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cnpg-operator
spec:
  podSelector:
    matchLabels:
      cnpg.io/podRole: instance
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - port: 8000
        - port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: orders-db-poolers
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: orders-db
      cnpg.io/podRole: pooler
  policyTypes:
    - Ingress
  ingress:
    # Any namespace owned by the orders team.
    - from:
        - namespaceSelector:
            matchLabels:
              team: orders
      ports:
        - port: 5432
    # Prometheus scraping PgBouncer metrics.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 9127
---
# Prometheus scraping Postgres metrics on every instance in the namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-metrics
spec:
  podSelector:
    matchLabels:
      cnpg.io/podRole: instance
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 9187
