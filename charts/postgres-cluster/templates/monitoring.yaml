{{- if .Values.monitoring.podMonitors }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ .Values.name }}
  labels:
    {{- include "pg.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: {{ .Values.name }}
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_label_cnpg_io_cluster]
          targetLabel: cnpg_cluster
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ .Values.name }}-poolers
  labels:
    {{- include "pg.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: {{ .Values.name }}
      cnpg.io/podRole: pooler
  podMetricsEndpoints:
    - port: metrics
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_label_cnpg_io_cluster]
          targetLabel: cnpg_cluster
        - sourceLabels: [__meta_kubernetes_pod_label_cnpg_io_poolerName]
          targetLabel: pooler
{{- end }}
{{- if .Values.monitoring.alerts }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: postgres
  labels:
    {{- include "pg.labels" . | nindent 4 }}
spec:
{{ .Files.Get "files/alerts.yaml" | indent 2 }}
{{- end }}
