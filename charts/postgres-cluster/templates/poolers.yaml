{{- $root := . }}
{{- range $type, $p := .Values.poolers }}
{{- if or (eq $type "rw") $p.enabled }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: {{ $root.Values.name }}-pooler-{{ $type }}
  labels:
    {{- include "pg.labels" $root | nindent 4 }}
spec:
  cluster:
    name: {{ $root.Values.name }}
  instances: {{ $p.instances }}
  type: {{ $type }}
  pgbouncer:
    poolMode: transaction
    parameters:
      max_client_conn: "1000"
      default_pool_size: {{ $p.defaultPoolSize | quote }}
      {{- if eq $type "rw" }}
      reserve_pool_size: "5"
      max_prepared_statements: "200"
      server_lifetime: "1800"
      query_wait_timeout: "30"
      {{- end }}
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: {{ $root.Values.team }}
    spec:
      containers: []
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              cnpg.io/poolerName: {{ $root.Values.name }}-pooler-{{ $type }}
{{- end }}
{{- end }}
