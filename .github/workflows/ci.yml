name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: yamllint and shellcheck
        run: make lint

  alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install promtool
        run: |
          source versions.env
          v=${PROMETHEUS_VERSION}
          curl -fsSL "https://github.com/prometheus/prometheus/releases/download/v${v}/prometheus-${v}.linux-amd64.tar.gz" |
            tar -xz --strip-components=1 "prometheus-${v}.linux-amd64/promtool"
          sudo install promtool /usr/local/bin/promtool
      - name: Check and unit-test alert rules
        run: make alerts

  e2e:
    # Real cluster, real operator: every change is applied to a three-zone
    # kind cluster, not just rendered.
    needs: [lint, alerts]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install kind
        run: |
          source versions.env
          curl -fsSLo kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          sudo install kind /usr/local/bin/kind
      - name: Cluster, platform and database
        run: make up
      - name: Validate the aks and eks overlays against the real CRDs
        run: make validate
      - name: End-to-end tests
        run: make test
      - name: Dump state on failure
        if: failure()
        run: |
          kubectl get pods -A -o wide
          kubectl -n orders get cluster,database,backup -o wide || true
          kubectl -n orders describe cluster orders-db || true
          kubectl -n cnpg-system logs deploy/cnpg-cloudnative-pg --tail=200 || true
