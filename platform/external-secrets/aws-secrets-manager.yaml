# EKS: External Secrets reads Secrets Manager through a Pod Identity
# association for external-secrets/external-secrets; the role allows
# secretsmanager:GetSecretValue on pg/* only.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: platform-secrets
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-west-1
  conditions:
    - namespaceSelector:
        matchExpressions:
          - key: team
            operator: Exists
